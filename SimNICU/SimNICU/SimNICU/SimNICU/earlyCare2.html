				<span style="font-size:17px;"><span style="font-family:arial,helvetica,sans-serif;">Gentle ventilation breaths<br />

			<li>
				<span style="font-size:17px;"><span style="font-family:arial,helvetica,sans-serif;">Monitor effect by heart rate</span></span></li>

				<span style="font-size:17px;"><span style="font-family:arial,helvetica,sans-serif;">Start&nbsp;with 21% FiO<sub>2&nbsp;</sub>-&nbsp;<br />

			<li>
				<span style="font-size:17px;"><span style="font-family:arial,helvetica,sans-serif;">PEEP at least 5 cm H<sub>2</sub>O</span></span></li>
			<li>
				<span style="font-size:17px;"><span style="font-family:arial,helvetica,sans-serif;">Cover with towels when transferring</span></span></li>
